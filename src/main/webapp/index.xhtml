<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Kalkulator kredytowy</title>
    </h:head>




    <ui:composition template="/templates/page-template.xhtml">
        <ui:define name="pageContent">
            
                <p:panel header="Kalkulator kredytowy - Oblicz ratę kredytu" toggleable="true"
                         closable="true" toggleSpeed="500" style="margin:1em auto">
                    <h:form id="calcForm">
                        <p:splitter style="height:550px; width:100%;">
                            <p:splitterPanel>
                                <p:panelGrid columns="1" styleClass="noSpacing">
                                    <h:outputLabel for="kwota" value="Kwota kredytu:" />
                                    <p:inputText id="kwota" value="#{kredytBB.kwota}" required="true"
                                                 requiredMessage="Brak kwoty kredytu"
                                                 converterMessage="Nie poprawna wartość zmiennoprzecinkowa"
                                                 validatorMessage="Kwota musi być w zakresie 100 - 1 000 000 zł">
                                        <f:validateDoubleRange minimum="100" maximum="1000000" />
                                    </p:inputText>
                                    <p:message for="kwota" />

                                    <h:outputLabel for="lata" value="Liczba lat:" />
                                    <p:inputText id="lata" value="#{kredytBB.lata}" required="true"
                                                 requiredMessage="Brak ilości lat"
                                                 validatorMessage="Kredyt musi być w zakresie 1 - 50 lat">
                                        <f:validateLongRange minimum="1" maximum="50" />
                                    </p:inputText>
                                    <p:message for="lata" />

                                    <h:outputLabel for="procent" value="Oprocentowanie (%):" />
                                    <p:inputText id="procent" value="#{kredytBB.procent}" required="true"
                                                 requiredMessage="Brak oprocentowania"
                                                 converterMessage="Nie poprawna wartość zmiennoprzecinkowa"
                                                 validatorMessage="Minimalne oprocentowanie musi wynosić 0,1 % , a maksymalnie 60%">
                                        <f:validateDoubleRange minimum="0.1" maximum="60" />
                                    </p:inputText>
                                    <p:message for="procent" />
                                </p:panelGrid>
                            </p:splitterPanel>
                            <p:splitterPanel>
                                <p:panelGrid columns="1" style="text-align:center">
                                    <p:commandButton value="Oblicz" action="#{kredytBB.calc()}" style="margin-bottom:10px;"/>
                                    <p:commandButton value="Dodaj (AJAX)" action="#{kredytBB.calc_AJAX()}"
                                                     process="@form" update="msgs resultLabel"
                                                     style="margin-bottom:20px;"/>
                                    <p:messages id="msgs" showDetail="true" />
                                    <h:outputText value="Wynik (rata):" rendered="#{not empty kredytBB.result}" />
                                    <p:outputLabel id="resultLabel" value="#{kredytBB.result}" rendered="#{not empty kredytBB.result}" />
                                </p:panelGrid>
                            </p:splitterPanel>
                        </p:splitter>
                    </h:form>
                </p:panel>

        </ui:define>
    </ui:composition>
    
</html>
