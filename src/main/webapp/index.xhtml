<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Kalkulator kredytowy</title>
</h:head>

<h:body>
    

    <p:panel header="Kalkulator kredytowy - Oblicz ratę kredytu" toggleable="true" closable="true" toggleSpeed="500" style="margin:1em auto">
      <h:form id="calcForm">
        <p:panelGrid columns="1">

            <h:outputLabel for="kwota" value="Kwota kredytu:" />
            <p:inputText id="kwota" value="#{kredytBB.kwota}" required="true" requiredMessage="Brak kwoty kredytu" />
            <p:message for="kwota"/>

            <h:outputLabel for="lata" value="Liczba lat:" />
            <p:inputText id="lata" value="#{kredytBB.lata}" required="true" requiredMessage="Brak ilości lat" />
            <p:message for="lata"/>

            <h:outputLabel for="procent" value="Oprocentowanie (%):" />
            <p:inputText id="procent" value="#{kredytBB.procent}" required="true" requiredMessage="Brak oprocentowania" />
            <p:message for="procent"/>

            <p:panelGrid columns="1" style="border:none; padding:0;">
                <p:commandButton value="Oblicz" action="#{kredytBB.calc()}" />
                <p:commandButton value="Dodaj (AJAX)" action="#{kredytBB.calc_AJAX()}" 
                                 process="@form" update="msgs resultLabel" />
            </p:panelGrid>

            <p:messages id="msgs" showDetail="true" />

            <h:outputLabel value="Wynik (rata):" rendered="#{not empty kredytBB.result}" />
            <p:outputLabel id="resultLabel" value="#{kredytBB.result}" rendered="#{not empty kredytBB.result}" />

        </p:panelGrid>
    </h:form>
</p:panel>
</h:body>
</html>
