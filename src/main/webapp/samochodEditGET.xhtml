<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewParam name="s" value="#{samochodEditGETBB.samochod.idSamochodu}"
                     converterMessage="Nieoczekiwany błąd"/>
        <f:event type="preRenderView" listener="#{samochodEditGETBB.onLoad()}" />
    </f:metadata>

    <h:head>
        <meta charset="utf-8"/>
        <title>Edycja samochodu (GET)</title>
    </h:head>
    <h:body style="background-color: #eee; margin: 0.5em;">

        <p:panel toggleable="true" header="Edycja samochodu (GET)">

            <h:form rendered="#{samochodEditGETBB.samochod != null}">
                <h:panelGrid columns="3" cellpadding="5">

                    <h:outputLabel for="s-marka" value="Marka:" />
                    <p:inputText id="s-marka" value="#{samochodEditGETBB.samochod.marka}"
                                 required="true"/>
                    <p:message for="s-marka" display="icon"/>

                    <h:outputLabel for="s-model" value="Model:" />
                    <p:inputText id="s-model" value="#{samochodEditGETBB.samochod.model}"
                                 required="true"/>
                    <p:message for="s-model" display="icon"/>

                    <h:outputLabel for="s-rok" value="Rok:" />
                    <p:inputText id="s-rok" value="#{samochodEditGETBB.samochod.rocznik}"
                                 required="true">
                        <f:validateLongRange minimum="1900" maximum="2050" />
                    </p:inputText>
                    <p:message for="s-rok" display="icon"/>

                    <h:outputLabel for="s-cena" value="Cena:" />
                    <p:inputText id="s-cena" value="#{samochodEditGETBB.samochod.cenaZaDzien}"
                                 required="true"/>
                    <p:message for="s-cena" display="icon"/>

                    <h:outputLabel for="s-zdjecie" value="Link do zdjęcia:" />
                    <p:inputText id="s-zdjecie"
                                 value="#{samochodEditGETBB.samochod.zdjecie}"
                                 required="true"/>
                    <p:message for="s-zdjecie" display="icon"/>

                </h:panelGrid>

                <p:messages id="msgs" />

                <p:commandButton value="Zapisz" action="#{samochodEditGETBB.saveData()}"
                                 style="margin-right: 1em;" update="@form" />

                <p:button value="Anuluj" outcome="samochodList" />
            </h:form>

        </p:panel>

    </h:body>
</html>
