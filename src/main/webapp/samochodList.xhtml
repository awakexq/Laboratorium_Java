<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <meta charset="utf-8" />
    <title>Lista samochodów</title>
</h:head>
<h:body style="background-color: #eee; margin: 0.5em;">

    <p:panel header="Opcje wyszukiwania" toggleable="true" collapsed="true"
             style="margin-bottom: 1em;">

        <h:form>
            <h:panelGrid columns="2" cellpadding="5">

                <h:outputLabel value="Marka:" />
                <p:inputText value="#{samochodListBB.marka}" />

                <p:commandButton value="Szukaj" update="form-table" />

            </h:panelGrid>
        </h:form>
    </p:panel>

    <p:messages />

    <h:form id="form-table" style="margin-bottom:1em;">

        <p:commandButton value="Dodaj nowy samochód"
                         style="margin-bottom:1em;"
                         action="#{samochodListBB.newSamochod()}"/>

        <p:dataTable value="#{samochodListBB.list}" var="s">

            <p:column>
                <f:facet name="header"><h:outputText value="Marka"/></f:facet>
                <h:outputText value="#{s.marka}" />
            </p:column>

            <p:column>
                <f:facet name="header"><h:outputText value="Model"/></f:facet>
                <h:outputText value="#{s.model}" />
            </p:column>

            <p:column>
                <f:facet name="header"><h:outputText value="Rok"/></f:facet>
                <h:outputText value="#{s.rocznik}" />
            </p:column>

            <p:column>
                <f:facet name="header"><h:outputText value="Cena za dzień"/></f:facet>
                <h:outputText value="#{s.cenaZaDzien}" />
            </p:column>

            <p:column>
                <f:facet name="header"><h:outputText value="Zdjęcie"/></f:facet>
                <a href="#{s.zdjecie}" target="_blank">Podgląd</a>
            </p:column>

            <p:column>
                <f:facet name="header"><h:outputText value="Opcje"/></f:facet>

                <p:commandButton value="Edytuj"
                                 action="#{samochodListBB.editSamochod(s)}"
                                 style="margin-right:0.5em"/>

                <p:commandButton value="Usuń"
                                 action="#{samochodListBB.deleteSamochod(s)}"
                                 update="@form" style="margin-right:0.5em"/>

                <p:button outcome="samochodEditGET" value="Edytuj (GET)">
                    <f:param name="s" value="#{s.idSamochodu}" />
                </p:button>

            </p:column>

        </p:dataTable>
    </h:form>

</h:body>
</html>
