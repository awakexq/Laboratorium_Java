<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Wynik kalkulacji</title>
</h:head>

<h:body>
    <h:form>

        <p:panel header="Wynik kalkulacji kredytu" style="width:300px; margin:auto; text-align:center;">
            <h:panelGroup rendered="#{not empty kredytBB.result}">
                <p:outputLabel value="Rata miesięczna: " />
                <h:outputText value="#{kredytBB.result} zł" style="font-weight:bold; font-size:1.2em;" />
            </h:panelGroup>
        </p:panel>
        <p:messages showDetail="true" style="width:300px; margin:auto;" />
        <p:commandButton value="Powrót" action="index" icon="pi pi-arrow-left" style="display:block; margin:auto;" />

    </h:form>
</h:body>
</html>
